name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install build and test dependencies
        run: npm ci --ignore-scripts

      - name: Verify packaged MCP artifact
        run: |
          git ls-files --error-unmatch mcp/pdca-state-server.bundle.mjs
          git ls-files --error-unmatch THIRD_PARTY_NOTICES.md
          npm run build:mcp
          git diff --exit-code -- mcp/pdca-state-server.bundle.mjs THIRD_PARTY_NOTICES.md

      - name: Verify checked-in core release
        run: |
          git ls-files --error-unmatch packages/core/release/second-claude-core-4.0.0.tgz
          git ls-files --error-unmatch packages/core/release/second-claude-core-4.0.0.tgz.sha256
          npm run verify:core-release
          git diff --exit-code -- packages/core/release/second-claude-core-4.0.0.tgz packages/core/release/second-claude-core-4.0.0.tgz.sha256

      - name: Syntax checks
        run: find hooks mcp daemon scripts skills -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Full test suite
        run: npm test
        env:
          UNBLOCK_SKIP_NETWORK_TESTS: "1"

      - name: Validate plugin manifests
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
          const codexPlugin = JSON.parse(fs.readFileSync('.codex-plugin/plugin.json', 'utf8'));
          const market = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
          const walnut = fs.readFileSync('walnut.manifest.yaml', 'utf8').match(/^version:\s*["']?([^"'\s]+)["']?/m)?.[1];
          const versions = [lock.version, lock.packages?.['']?.version, plugin.version, codexPlugin.version, market.metadata?.version, market.plugins?.[0]?.version, walnut];
          if (versions.some((version) => version !== pkg.version)) {
            throw new Error(`release version drift: package=${pkg.version}, surfaces=${versions.join(',')}`);
          }
          NODE

      - name: Verify agent frontmatter
        run: |
          for f in agents/*.md; do
            [ "$(basename "$f")" = "README.md" ] && continue
            head -1 "$f" | grep -q '^---' || {
              echo "MISSING frontmatter: $f"
              exit 1
            }
          done

      - name: Verify skill docs
        run: |
          for d in skills/*/; do
            [ "$(basename "$d")" = "unblock" ] && continue
            [ -f "${d}SKILL.md" ] || {
              echo "MISSING SKILL.md: $d"
              exit 1
            }
          done
