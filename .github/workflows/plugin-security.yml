name: Plugin Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan with the catalog's pinned HOL scanner
        uses: hashgraph-online/ai-plugin-scanner-action@59f2f1867207d2751c373fafbd1a9b7a4a23377f # v1.2.804
        with:
          plugin_dir: "."
          mode: scan
          format: json
          output: ${{ runner.temp }}/source-scan.json
          min_score: 80
          fail_on_severity: high
          online: "false"
          trust_repository_policy: "false"
          pr_comment: "off"
      - name: Keep the scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hol-source-scan
          path: ${{ runner.temp }}/source-scan.json
          if-no-files-found: error
          retention-days: 14
